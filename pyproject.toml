[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mdforge"
version = "0.1.0"
description = "Convert PDF, DOCX, PPTX, XLSX, HTML, and more into LLM-ready Markdown with YAML metadata and RAG-optimized chunking."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AndrazKen", email = "m.kenangromero@gmail.com" }]
keywords = [
    "markdown",
    "llm",
    "rag",
    "pdf",
    "docx",
    "pptx",
    "xlsx",
    "chunking",
    "document-conversion",
    "markitdown-alternative",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.2.0", "pdfplumber>=0.11.0"]
docx = ["python-docx>=1.1.0"]
pptx = ["python-pptx>=0.6.23"]
xlsx = ["openpyxl>=3.1.2"]
html = ["beautifulsoup4>=4.12.3", "lxml>=5.2.0"]
text = ["charset-normalizer>=3.3.2"]
all = [
    "pypdf>=4.2.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.2",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.0",
    "charset-normalizer>=3.3.2",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12",
    "pre-commit>=3.7.0",
    "build>=1.2.0",
    "twine>=5.1.0",
]

[project.urls]
Homepage = "https://github.com/AndrazKen/mdforge"
Documentation = "https://github.com/AndrazKen/mdforge#readme"
Repository = "https://github.com/AndrazKen/mdforge"
Issues = "https://github.com/AndrazKen/mdforge/issues"
Changelog = "https://github.com/AndrazKen/mdforge/blob/main/CHANGELOG.md"

[project.scripts]
mdforge = "mdforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mdforge"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "docs",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
]
exclude = ["**/__pycache__", "**/.pytest_cache"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:mdforge.*"]

[tool.coverage.run]
source = ["mdforge"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "BLE", "C4", "SIM", "RET", "ARG", "PTH", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # typer uses function calls as defaults
    "RUF001", # allow typographic characters inside string literals
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["mdforge"]

[tool.mypy]
python_version = "3.10"
files = ["src/mdforge"]
strict = true
warn_unreachable = true
ignore_missing_imports = true
disallow_untyped_decorators = false
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["pypdf.*", "pdfplumber.*", "docx.*", "pptx.*", "openpyxl.*", "bs4.*", "lxml.*", "charset_normalizer.*"]
ignore_missing_imports = true
